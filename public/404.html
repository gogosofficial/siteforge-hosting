<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seite nicht gefunden – SiteForge</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06080d">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/assets/img/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="error-page">
<header class="site-header">
  <div class="container">
    <nav class="nav" aria-label="Hauptnavigation">
      <a href="/" class="logo" aria-label="SiteForge – zur Startseite">
        <img src="/assets/img/logo-mark.svg" alt="" width="38" height="38">
        <span class="logo-text" aria-hidden="true">
          <span class="logo-name">Site<span>Forge</span></span>
          <span class="logo-tagline">Websites &amp; More</span>
        </span>
      </a>
    </nav>
  </div>
</header>
<main>
  <div class="container">
    <p class="error-code" aria-hidden="true">404</p>
    <h1>Seite nicht gefunden</h1>
    <p>Die aufgerufene Seite existiert nicht oder wurde verschoben. Auf der Startseite findest du alle Infos zu Paketen, Referenzen und Kontakt.</p>
    <a href="/" class="btn btn-primary">Zur Startseite</a>
  </div>
</main>
</body>
</html>
